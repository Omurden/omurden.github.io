# Content of the site. Everything a human would want to change lives here;
# the templates in _includes/ only lay it out.

profile:
  name: Ömürden Cengiz
  initials: ÖC
  location: Amsterdam
  headline: I break software so that <em>other people do not have to</em>.
  intro: >
    I test software for a living and I have never managed to stop there. Four things have my hands
    in them — **quality engineering**, **events and music**, **a game studio**, and **a
    trading-signal service**. This page is the honest order of them.
  email: omurdenden@gmail.com

# The four primary areas, in the order the Human ruled them (2026-09-07):
# QA · Music · Games · Finance. `key` picks the room's colour in _sass/_rooms.scss.
rooms:
  - id: quality
    key: q
    num: "01"
    kind: Quality
    title: Quality Engineering
    role: QA Engineer · Albert Heijn, Amsterdam
    body:
      - Testing web, mobile and API systems — manual where judgement beats a script, automated
        everywhere else. Selenium, Robot Framework, RestAssured, XCUITest, Espresso; the CI that
        runs them and the database underneath.
      - I founded **QAist**, Amsterdam's QA meetup, and **Robot Framework Turkey**.
    links:
      - { label: QAist Meetup, url: "https://www.meetup.com/QAIstMeetup" }
      - { label: Robot Framework Turkey, url: "https://www.meetup.com/Robot-Framework-Turkey" }
      - { label: Writing on Medium, url: "https://medium.com/@omurdenden/" }
      - { label: CV on LinkedIn, url: "https://linkedin.com/in/omurden" }

  - id: music
    key: m
    num: "02"
    kind: Music
    title: DJ Denden
    href: "https://djdenden.com"
    role: Turkish Pop &amp; 90s nights · Event promotion
    body:
      - I put the nights on and I play them. **Turkish Pop and 90s nights across the Netherlands** —
        weddings, corporate events and private parties, from Amsterdam and Rotterdam to Utrecht and
        Eindhoven, and further into Europe when the night is worth the drive.
      - "**3Cats Events** is the other half: venues, line-ups and the unglamorous work that decides
        whether a room actually fills."
    pill_key: "Bookings:"
    pill: djdenden.com — the full set, in English, Dutch and Turkish.
    links:
      - { label: djdenden.com, url: "https://djdenden.com" }
      - { label: Dates on Instagram, url: "https://www.instagram.com/dendenevent/" }
      - { label: Events on Facebook, url: "https://www.facebook.com/dendenevent/" }

  - id: games
    key: g
    num: "03"
    kind: Games
    title: 3Cats Studio
    href: "https://3cats.studio"
    role: Founder · Independent game studio, Amsterdam
    body:
      - Premium, story-first, choice-driven fiction — **games you can actually finish**. One human
        producer holding editorial control over an AI production crew, which is a working method
        rather than a slogan.
    pill_key: "First title:"
    pill: All Time High — a moral-descent crypto thriller. On Steam.
    links:
      - { label: 3cats.studio, url: "https://3cats.studio" }

  - id: finance
    key: f
    num: "04"
    kind: Finance
    title: AlgoSignals
    href: "https://algosignals.finance"
    role: Builder · Algorithmic trading signals
    body:
      - Rules-based setups across US, EU, Turkish, crypto and forex markets, delivered by email and
        on X. **Every signal is tracked to its real outcome** — the losses are published next to the
        wins, which is the entire point and the reason it was worth building.
    pill_key: "Underneath it:"
    pill: chart ideas on TradingView and automated MT4 bots on MQL5 — the workshop the product came out of.
    links:
      - { label: algosignals.finance, url: "https://algosignals.finance" }
      - { label: TradingView ideas, url: "https://www.tradingview.com/u/omurden/" }
      - { label: MQL5 bots, url: "https://www.mql5.com/en/users/silverrush/seller" }

