{% assign p = site.data.data.profile %}
<nav class="nav">
  <div class="wrap row">
    <a class="mark" href="#top">{{ p.initials }}</a>

    <div class="nav-links">
      {% for room in site.data.data.rooms %}
      <a class="{{ room.key }}" href="#{{ room.id }}">{{ room.kind }}</a>
      {% endfor %}
    </div>

    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch between light and dark theme">
      <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</nav>
