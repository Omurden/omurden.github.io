<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <a class="skip-link" href="#top">Skip to content</a>

  {% include masthead.html %}

  <main class="wrap" id="top">
    {{ content }}
  </main>

  <div class="wrap">
    {% include footer.html %}
  </div>

  <script>
  (function () {
    // The stored theme is already applied in <head>; this only handles the toggle.
    var root = document.documentElement, btn = document.getElementById('themeBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var cur = root.getAttribute('data-theme');
      // The page always renders light until data-theme says otherwise, so the
      // untouched state is 'light' regardless of what the OS prefers.
      if (!cur) cur = 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
  </script>
</body>
</html>
